name: Update roleplay results

on:
  schedule:
    - cron: "0 5 * * *"   # 07:00 Madrid in summer, 06:00 in winter
  workflow_dispatch:       # "Run workflow" button for a manual refresh

permissions:
  contents: write
  actions: write

concurrency:
  group: update-calls
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch calls from ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.683864212fa25b70ba1198afda72ffde5a22e9d4d487b1fc7c612c9ebf14d070 }}
        run: python scripts/fetch_calls.py
      - name: Commit and redeploy if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add data/calls.json
          if git diff --cached --quiet; then
            echo "No new calls"
          else
            git commit -m "Update roleplay results $(date -u +%F)"
            git push
            # Pushes made by this workflow don't trigger the Pages deploy, so start it explicitly
            gh workflow run static.yml --ref main
          fi
